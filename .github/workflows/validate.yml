name: Validate resource packs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python dailytools.py validate
      - run: python -m unittest discover -s tests -v
      - run: python dailytools.py download vendor-independent-harness
      - uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.os }}
          path: dist/
